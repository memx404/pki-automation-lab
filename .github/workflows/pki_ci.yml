name: PKI Secure CI Pipeline
on: [push, workflow_dispatch]

jobs:
  security-and-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Security Tools & Deps
        run: |
          pip install bandit cryptography pytest

      - name: Run Bandit (Security Scan)
        run: bandit -r . -v

      - name: Run PKI Functional Test
        run: python3 test_pki_tool.py